      - navn: Modell C
        y: [0, 0.28, 0.45, 0.58, 0.68, 0.76, 0.83, 0.89, 0.94, 0.98, 1]
  sporsmal: |
    Figuren viser ROC-kurvene til tre klassifikatorer. Hvilke påstander stemmer?
  alternativer:
