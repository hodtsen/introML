    Læringsraten styrer hvor langt vi går i hvert steg. For liten: stabil, men treg nedgang. For stor: stegene skyter over minimum, og tapet oscillerer eller øker. Passe: rask nedgang som flater ut nær minimum. Læringsraten er en hyperparameter som velges med validering.
  husk: 'Hopper tapet: for høy læringsrate. Synker det knapt: for lav.'

