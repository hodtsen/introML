  forklaring: |
    Jo nærmere kurven ligger hjørnet $(0, 1)$, jo bedre skiller modellen klassene over alle terskler. AUC er sannsynligheten for at et tilfeldig positivt punkt får høyere score enn et tilfeldig negativt. Diagonalen tilsvarer myntkast (AUC = 0,5). En ROC-kurve sier ingenting direkte om accuracy ved en bestemt terskel.
  husk: 'Kurve nær (0, 1) = god modell. Diagonal = AUC 0,5. ROC sier ikke noe om accuracy ved én terskel.'

