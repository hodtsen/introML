  sporsmal: |
    ```python
    explainer = shap.TreeExplainer(regressor, data=X_train)
    shap_values = explainer.shap_values(X_test)
    total = explainer.expected_value + shap_values[i, :].sum()
    ```

    Hva er `total`, (tilnærmet) uansett hvilket punkt `i` du velger?
  alternativer:
    - tekst: 'Modellens prediksjon for testpunkt `i`'
      riktig: true
      forklaring: 'Basisverdien pluss alle SHAP-verdiene gir prediksjonen. Det følger av effektivitetsaksiomet.'
    - tekst: 'Den sanne targetverdien for testpunkt `i`'
      forklaring: 'SHAP forklarer modellens prediksjon, ikke fasiten.'
    - tekst: 'Snittprediksjonen over bakgrunnsdataene'
      forklaring: 'Det er `expected_value` alene, $\phi_0$.'
    - tekst: 'Den globale viktigheten til den viktigste featuren'
      forklaring: 'Global viktighet er snittet av absoluttverdier over mange punkter.'
  forklaring: |
    SHAP fordeler forskjellen mellom prediksjonen og basisverdien på featurene: $f(\mathbf{x}^*) = \phi_0 + \sum_j \phi_j^*$, med $\phi_0 = \mathbb{E}[f(\mathbf{x})]$ over bakgrunnsdataene. Det er dette force-plottet viser for ett punkt.
  husk: 'expected_value + sum(SHAP-verdier) = prediksjonen for punktet.'

