- id: "8.5-07"
  del: "8.5"
  niva: middels
  type: enkeltvalg
  tags: [kode, prosjekt-4]
  sporsmal: |
    ```python
    explainer = LimeTabularExplainer(X_train, feature_names=features, mode="classification")
    exp = explainer.explain_instance(x, classifier.predict_proba, num_features=3)
    ```

    Hvilken rolle har `num_features=3` i LIME-formuleringen $\xi(\mathbf{x}) = \arg\min_{g \in G}\mathcal{L}(f, g, \pi_{\mathbf{x}}) + \Omega(g)$?
  alternativer:
    - tekst: 'Den begrenser kompleksiteten $\Omega(g)$ til tre features'
      riktig: true
      forklaring: 'En enkel surrogat er lettere å forstå, på bekostning av hvor godt den etterligner modellen lokalt.'
    - tekst: 'Den bestemmer hvor mange nabopunkter som trekkes rundt $\mathbf{x}$'
      forklaring: 'Antall naboer er en annen innstilling. `num_features` gjelder forklaringen.'
    - tekst: 'Den fjerner alle andre features fra den komplekse modellen $f$'
      forklaring: 'Den komplekse modellen endres ikke. LIME er post-hoc.'
    - tekst: 'Den er vektingen $\pi_{\mathbf{x}}$ av naboene etter avstand'
      forklaring: '$\pi_{\mathbf{x}}$ vekter naboene etter nærhet til punktet som forklares.'
  forklaring: |
    LIME trekker nye punkter rundt $\mathbf{x}$, lar den komplekse modellen $f$ predikere dem, vekter dem etter nærhet ($\pi_{\mathbf{x}}$) og tilpasser en enkel lineær modell $g$. $\mathcal{L}$ måler hvor godt $g$ etterligner $f$ lokalt, og $\Omega(g)$ holder $g$ enkel. Å begrense antall features er en konkret måte å holde $\Omega(g)$ lav på.
  husk: 'LIME: L = troskap mot f lokalt, Ω(g) = enkelhet (f.eks. num_features), π_x = nærhetsvekt.'
