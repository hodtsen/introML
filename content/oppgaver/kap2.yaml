  sporsmal: |
    Treningsdataene har 1800 punkter i klasse 0 og 200 i klasse 1. Du vil oversample klasse 1:

    ```python
    rng = np.random.default_rng(0)
    idx_min = np.where(y_train == 1)[0]          # 200 indekser
    ekstra = rng.choice(idx_min, size=1800, replace=False)
    ```

    Hva skjer?
  alternativer:
    - tekst: 'Linjen feiler, fordi 1800 ulike punkter ikke kan trekkes fra 200 uten tilbakelegging.'
      riktig: true
      forklaring: 'Oversampling dupliserer punkter og må bruke `replace=True`.'
    - tekst: 'Du får 1800 nye minoritetspunkter som interpoleres mellom de 200 du har.'
      forklaring: '`rng.choice` trekker bare blant indeksene du gir den. Den lager ingen nye punkter.'
