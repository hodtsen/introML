  forklaring: |
    Undersampling trekker *uten* tilbakelegging fra majoriteten (`replace=False`, `size` lik minoritetens størrelse). Oversampling trekker *med* tilbakelegging fra minoriteten, så de samme punktene gjentas. Det er også grunnen til at oversampling kan gi overtilpasning.
