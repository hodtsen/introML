  niva: avansert
  type: enkeltvalg
  tags: [kode, oving-2]
  sporsmal: |
    I øving 2 skal du bruke naiv Bayes uten biblioteker. Du har regnet ut:

    ```python
    p_c = df["survived"].value_counts(normalize=True)
    p_x_1 = df[df["survived"] == 1]["sex"].value_counts(normalize=True)
    p_x_0 = df[df["survived"] == 0]["sex"].value_counts(normalize=True)
    ```

    Hvilket uttrykk er proporsjonalt med $p(\text{survived} = 1 \mid \text{sex} = \text{Male})$?
  alternativer:
    - tekst: '`p_x_1["Male"] * p_c[1]`'
      riktig: true
      forklaring: 'Likelihood ganger prior, $p(x \mid C)\,p(C)$. Nevneren $p(x)$ er lik for begge klassene.'
    - tekst: '`p_x_1["Male"]`'
      forklaring: 'Bare likelihooden $p(x \mid C = 1)$. Uten prioren tas det ikke hensyn til hvor vanlig klassen er.'
    - tekst: '`p_c[1] / p_x_1["Male"]`'
      forklaring: 'Bayes multipliserer likelihood og prior, den deler ikke.'
    - tekst: '`df["sex"].value_counts(normalize=True)["Male"] * p_c[1]`'
      forklaring: 'Bruker $p(x)$ over hele datasettet, ikke $p(x \mid C = 1)$. Da blir svaret likt for begge klassene.'
  forklaring: |
    $p(C \mid x) = p(x \mid C)\,p(C)/p(x)$. For å avgjøre klassen sammenligner du `p_x_1["Male"] * p_c[1]` med `p_x_0["Male"] * p_c[0]`. Vil du ha selve sannsynligheten, deler du på summen av de to, som er $p(x)$. Med flere features ganger naiv Bayes inn én betinget sannsynlighet per feature.
  husk: 'Posterior ∝ likelihood (filtrert på klassen) × prior.'

