    - tekst: 'MSE kan ikke brukes for regresjon'
      forklaring: 'MSE er standard tap for regresjon.'
    - tekst: 'ReLU kan ikke brukes i skjulte lag for regresjon'
      forklaring: 'ReLU i skjulte lag er helt vanlig også for regresjon.'
    - tekst: 'Input-formen skal være `(32,)`'
      forklaring: 'Input-formen er antall features, her 1.'
  forklaring: |
    Bytt til `layers.Dense(1)` (lineær aktivering som standard). Skalering av targetene kan også hjelpe treningen.
  husk: 'Regresjon: Dense(1) uten aktivering i output, MSE som tap.'

- id: "5.6-06"
  del: "5.6"
  niva: middels
  type: tekst
  tags: [oving-3]
  sporsmal: |
    Du trener et nevralt nett i Keras. Beskriv hvordan du ville brukt valideringsdata og early stopping, og hvilket tall du ville rapportert som modellens ytelse.
  eksempelsvar: |
    Jeg ville holdt av et valideringssett (for eksempel med `validation_split` eller egne valideringsdata) og latt `fit` regne ut `val_loss` etter hver epoke. Med en `EarlyStopping`-callback med `monitor="val_loss"` (og gjerne `restore_best_weights=True`) stopper treningen når valideringstapet ikke lenger blir bedre, og vektene fra beste epoke beholdes. Til slutt ville jeg rapportert resultatet fra `model.evaluate` på et testsett som ikke er brukt til noe valg underveis, ikke trenings- eller valideringsaccuracy.
  punkter:
    - tekst: 'Valideringsdata og val_loss per epoke.'
      stikkord: ['validering', 'val_loss', 'validation']
    - tekst: 'Early stopping som overvåker val_loss og beholder beste vekter.'
      stikkord: ['earlystopping', 'early stopping', 'restore', 'beste']
    - tekst: 'Rapporterer evaluate på urørt testsett.'
      stikkord: ['evaluate', 'test']
  husk: 'Velg epoke på validering (early stopping), rapporter evaluate på test.'
