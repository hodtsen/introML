      forklaring: 'Hele datasettet brukes per steg.'
    - tekst: 'Stochastic gradient descent: én oppdatering per datapunkt'
      riktig: true
      forklaring: 'Batch size 1.'
    - tekst: 'Mini-batch: $N/B$ oppdateringer per epoke'
