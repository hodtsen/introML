- id: "5.4-K1"
  del: "5.4"
  niva: avansert
  type: enkeltvalg
  tags: [kode, prosjekt-4]
  sporsmal: |
    En student skriver treningsløkka for MNIST-nettet i prosjekt 4 slik:

    ```python
    for X_batch, y_batch in train_loader:
        output = model(X_batch)
        loss = loss_fn(output, y_batch)
        loss.backward()
        optimizer.step()
    ```

    Hva er konsekvensen av at `optimizer.zero_grad()` mangler?
  alternativer:
    - tekst: 'Gradientene fra tidligere batcher summeres opp, så hvert steg blir feil.'
      riktig: true
      forklaring: 'PyTorch *legger til* nye gradienter i `.grad`. Uten nullstilling inneholder den summen av alle batchene så langt.'
    - tekst: 'Ingenting, fordi `backward()` nullstiller gradientene før den regner ut nye.'
      forklaring: '`backward()` akkumulerer. Det er derfor `zero_grad()` står først i alle løkkene i kurset.'
    - tekst: 'Vektene oppdateres ikke, fordi `step()` krever at gradientene er nullstilt.'
      forklaring: '`step()` bruker det som ligger i `.grad`, uansett. Vektene oppdateres, men med feil gradient.'
    - tekst: 'Tapet regnes ut på nytt for alle tidligere batcher i hver iterasjon.'
      forklaring: 'Tapet regnes bare for nåværende batch. Det er gradientene som hoper seg opp.'
  forklaring: |
    De fire stegene i PyTorch er `zero_grad`, forward og tap, `backward` og `step`. De går igjen både i MNIST-nettet i prosjekt 4 og i DQN-koden i notatene.
  husk: 'zero_grad → loss → backward → step.'

