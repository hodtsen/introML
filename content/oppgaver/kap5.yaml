  alternativer:
    - tekst: 'Gradientene blir støyete'
      riktig: true
      forklaring: 'Gradienten estimeres fra få punkter og varierer mye, så tapet hopper mer fra steg til steg.'
    - tekst: 'Gradientene blir mer presise'
      forklaring: 'Det er motsatt. Større batch gir mer presise gradientestimater.'
    - tekst: 'Hver epoke tar kortere tid'
      forklaring: 'Med batch size 1 blir det én oppdatering per datapunkt, så en epoke tar som regel lengre tid.'
    - tekst: 'Gradienten blir systematisk skjev'
      forklaring: 'SGD-gradienten er støyete, men forventningsrett.'
  forklaring: |
    Liten batch gir mange billige, men støyete steg. Stor batch gir få, presise, men dyre steg. Batch size er en hyperparameter.
  husk: 'Liten batch: mer støy, flere oppdateringer. Gradienten er forventningsrett uansett.'

- id: "5.5-03"
  del: "5.5"
  niva: grunnleggende
  type: flervalg
  sporsmal: |
    Hvilke koblinger er riktige?
  alternativer:
    - tekst: 'Gradient descent (batch): én oppdatering per epoke'
