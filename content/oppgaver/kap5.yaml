- id: "5.5-04"
  del: "5.5"
  niva: middels
  type: pastand
  sporsmal: |
    **Påstand:** Med batch size $B = N$ (hele treningssettet) er mini-batch gradient descent det samme som vanlig gradient descent.
  riktig: true
  forklaring: |
    Da brukes alle punktene i hver oppdatering, og det blir én oppdatering per epoke. Tilsvarende er $B = 1$ det samme som SGD. Mini-batch er altså en familie som har begge som ytterpunkter.
  husk: 'B = N: GD. B = 1: SGD. Mellom: mini-batch.'

