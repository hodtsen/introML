- id: "5.5-06"
  del: "5.5"
  niva: middels
  type: tekst
  sporsmal: |
    Forklar fordeler og ulemper ved mini-batch gradient descent sammenlignet med gradient descent på hele datasettet og SGD med ett punkt om gangen.
  eksempelsvar: |
    Gradient descent på hele datasettet gir presise gradienter, men hvert steg er dyrt, og det blir bare én oppdatering per epoke. SGD med ett punkt gir mange billige oppdateringer, men gradientene er svært støyete, og maskinvaren utnyttes dårlig. Mini-batch er et kompromiss: gradienten er et snitt over $B$ punkter, så støyen er moderat, og det blir $N/B$ oppdateringer per epoke. Batchene kan regnes effektivt parallelt. Litt støy kan også hjelpe treningen ut av dårlige områder. Batch size er en hyperparameter.
  punkter:
    - tekst: 'GD: presis, men dyr og få oppdateringer.'
      stikkord: ['presis', 'dyr', 'treg', 'én oppdatering']
    - tekst: 'SGD: mange oppdateringer, mye støy.'
      stikkord: ['støy', 'mange oppdateringer']
    - tekst: 'Mini-batch: kompromiss, N/B oppdateringer.'
      stikkord: ['kompromiss', 'n/b', 'mellomting', 'balanse']
    - tekst: 'Batch size er en hyperparameter (eller effektiv parallell utregning).'
      stikkord: ['hyperparameter', 'parallell', 'gpu']
  husk: 'GD presis men treg, SGD rask men støyete, mini-batch i midten.'

