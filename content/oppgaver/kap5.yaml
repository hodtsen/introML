# ---------------------------------------------------------------- kodeoppgaver (Kode-fanen)

- id: "5.1-K1"
  del: "5.1"
  niva: middels
  type: enkeltvalg
  tags: [kode, regning]
  sporsmal: |
    Perceptronet bruker Rosenblatts regel, med 1 først i `x` for biasen:

    ```python
    activation = np.dot(w, x)
    predicted = 1.0 if activation >= 0.0 else 0.0
    w = w + learning_rate * (expected - predicted) * x
    ```

    Med `w = [0.0, 0.5, 1.0]`, `x = [1, 2, -1]`, `expected = 0` og `learning_rate = 0.1`, hva er `w` etter oppdateringen?
  alternativer:
    - tekst: '`[-0.1, 0.3, 1.1]`'
      riktig: true
      forklaring: 'Aktiveringen er $0 + 1 - 1 = 0$, så prediksjonen er 1. Da er $0{,}1 \cdot (0 - 1) \cdot \mathbf{x} = [-0{,}1;\ -0{,}2;\ 0{,}1]$.'
    - tekst: '`[0.1, 0.7, 0.9]`'
      forklaring: 'Feil fortegn: dette legger til $0{,}1 \cdot \mathbf{x}$, som om prediksjonen var 0 og svaret 1.'
    - tekst: '`[0.0, 0.5, 1.0]`'
      forklaring: 'Ingen endring hadde vært riktig om prediksjonen var 0. Men $0 \ge 0$ gir prediksjon 1.'
    - tekst: '`[-0.1, 0.3, 0.9]`'
      forklaring: 'Fortegnet på siste komponent er feil: $-0{,}1 \cdot (-1) = +0{,}1$.'
  forklaring: |
    $w_i \leftarrow w_i + \eta\,(y - \hat{y})\,x_i$. Her er $y - \hat{y} = -1$, så vektene flyttes *bort fra* $\mathbf{x}$, og aktiveringen for dette punktet blir lavere neste gang. Legg merke til at `>=` gjør at aktivering 0 gir klasse 1.
  husk: 'Riktig prediksjon: ingen endring. Feil: flytt w med ±η·x.'

