- id: "N56"
  del: "6.6"
  kilde: "3.2.2 SNE"
  niva: avansert
  type: tekst
  sporsmal: |
    PCA bevarer global varians, mens t-SNE bevarer naboskap. Hvilken av metodene tror du håndterer outliers best, og hvorfor? (Notatene stiller spørsmålet uten å gi fasit, så vurder resonnementet ditt.)
  eksempelsvar: |
    PCA er mest følsom for outliers. Kovariansmatrisen bygger på kvadrerte avvik fra gjennomsnittet, så noen få ekstreme punkter kan dra prinsipalkomponentene mot seg og endre hele projeksjonen. t-SNE ser bare på naboskapssannsynligheter. En outlier har få nære naboer og påvirker i liten grad hvordan de andre punktene plasseres, men selve outlieren kan havne et tilfeldig sted i plottet og bør ikke tolkes ut fra posisjonen.
  punkter:
    - tekst: 'PCA er følsom: varians og kvadrerte avvik lar outliers dra komponentene.'
      stikkord: ['kvadr', 'varians', 'kovarians', 'drar', 'påvirker komponent', 'følsom']
    - tekst: 't-SNE er lokal/naboskapsbasert, så outliers påvirker de andre punktene lite.'
      stikkord: ['nabo', 'lokal', 'naboskap', 'sannsynlighet']
  husk: 'PCA (varians) er outlier-følsom. t-SNE (lokalt naboskap) påvirkes mindre, men posisjonen til outliers er lite meningsfull.'

- id: "N57"
  del: "6.7"
  kilde: "3.3 Anomalideteksjon"
  niva: avansert
  type: tekst
  sporsmal: |
    Tre metoder for anomalideteksjon er k-means (avstand til nærmeste klyngesenter over en terskel), DBSCAN (punkter som ikke tilhører noen klynge får label −1) og Isolation Forest (punkter som isoleres nær rotnoden i tilfeldige trær). Gi fordeler og ulemper ved metodene.
  eksempelsvar: |
    **k-means:** lett å forstå og rask på store datasett, og kan trenes på treningsdata og brukes på testdata. Men vi må velge k og en terskel (for eksempel 95-persentilen), som ikke har noen sann verdi. Outliers kan dra sentroidene, og metoden svikter i høye dimensjoner.

    **DBSCAN:** finner outliers direkte som en del av modelleringen og trenger ikke k. Men den er følsom for ε og min_samples, som er globale og passer dårlig når tettheten varierer. Den er ikke-parametrisk (kan ikke fit på trening og brukes på test), treg for store n og svak i høye dimensjoner.

    **Isolation Forest:** trenger verken avstandsmål eller labels, isolerer anomalier effektivt og kan brukes på nye data. Men vi må anslå andelen anomalier (contamination) og velge antall trær, og tilfeldigheten gjør resultatet litt varierende.
  punkter:
    - tekst: 'k-means: enkel og rask, men krever valg av k og terskel; outliers drar sentroidene.'
      stikkord: ['terskel', 'persentil', 'velge k', 'sentroide', 'rask']
    - tekst: 'DBSCAN: finner outliers direkte, men følsom for ε/min_samples og ikke-parametrisk.'
      stikkord: ['ε', 'epsilon', 'min_samples', 'tetthet', 'ikke-parametrisk', 'label -1', '−1']
    - tekst: 'Isolation Forest: ingen avstandsmål, men krever contamination/antall trær.'
      stikkord: ['contamination', 'andel', 'rotnode', 'isoler', 'trær', 'avstand']
  husk: 'k-means: terskel på avstand. DBSCAN: label −1, ikke-parametrisk. Isolation Forest: kort vei til roten = anomali.'
