# Kjører innholdskontroll, typesjekk, enhetstester, bygg og ende-til-ende-tester
# på pull requests, slik at feil i innhold eller kode fanges før merge.
name: Kontroll

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
